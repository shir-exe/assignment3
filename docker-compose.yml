version: "3.8"

services:
  # Database Container (MongoDB)
  mongo:
    image: mongo:latest
    container_name: drivealert-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-drivealert}
    volumes:
      - mongo_data:/data/db
    networks:
      - drivealert_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Server (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drivealert-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/drivealert}
      - DATABASE_NAME=${DATABASE_NAME:-drivealert}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-drivealert_super_secret_jwt_key_2025_bootcamp_secure}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - drivealert_network

  # Frontend Client (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drivealert-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - drivealert_network

volumes:
  mongo_data:
    driver: local

networks:
  drivealert_network:
    driver: bridge
